<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - GaonFresh</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#f4f4f4;
}

.container{
max-width:500px;
margin:30px auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
text-align:center;
color:green;
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:green;
color:white;
font-size:18px;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#0b7a0b;
}

</style>

</head>

<body>

<div class="container">

<h2>🛒 Checkout</h2>

<form id="checkoutForm">

<input type="text" placeholder="पूरा नाम" required>

<input type="tel" placeholder="मोबाइल नंबर" required>

<textarea placeholder="पूरा पता" required></textarea>

<input type="text" placeholder="शहर" required>

<input type="text" placeholder="पिनकोड" required>

<h3>Payment Method</h3>

<label>
<input type="radio" checked>
Cash on Delivery
</label>

<br><br>

<button type="submit">
Place Order
</button>

</form>

</div>

<script>

document.getElementById("checkoutForm").addEventListener("submit",function(e){

e.preventDefault();

const name=document.querySelector('input[placeholder="पूरा नाम"]').value;
const mobile=document.querySelector('input[placeholder="मोबाइल नंबर"]').value;
const address=document.querySelector("textarea").value;
const city=document.querySelector('input[placeholder="शहर"]').value;
const pin=document.querySelector('input[placeholder="पिनकोड"]').value;

let cart=JSON.parse(localStorage.getItem("cart"))||[];

if(cart.length===0){

alert("आपका Cart खाली है");

return;

}

let total=0;

let message="🛒 GaonFresh Order\n\n";

message+="👤 Name : "+name+"\n";
message+="📱 Mobile : "+mobile+"\n";
message+="📍 Address : "+address+", "+city+" - "+pin+"\n";
message+="💳 Payment : Cash on Delivery\n\n";

message+="📦 Products\n";

cart.forEach(function(item){

let qty=item.qty||1;

let price=parseInt(item.price.replace(/[^\d]/g,""));

total+=price*qty;

message+="• "+item.name+" × "+qty+" = ₹"+(price*qty)+"\n";

});

message+="\n💰 Total : ₹"+total;

const whatsapp = "https://wa.me/919695243488?text=" + encodeURIComponent(message);

// Cart खाली करो
localStorage.setItem("cart", JSON.stringify([]));

// WhatsApp खोलो
window.location.href = whatsapp;

});

</script>

</body>
</html>
