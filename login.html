<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - GaonFresh</title>

<link rel="stylesheet" href="assets/css/style.css">

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.login-box{
width:90%;
max-width:400px;
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h2{
text-align:center;
color:green;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
box-sizing:border-box;
font-size:16px;
}

button{
width:100%;
padding:12px;
background:green;
color:#fff;
font-size:17px;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#0b7a0b;
}

#otpSection{
display:none;
}

</style>

</head>

<body>

<div class="login-box">

<h2>📱 Login with OTP</h2>

<input
type="tel"
id="phone"
placeholder="+91XXXXXXXXXX">

<button id="sendOtp">
Send OTP
</button>

<div id="recaptcha-container"></div>

<div id="otpSection">

<input
type="text"
id="otp"
placeholder="Enter OTP">

<button id="verifyOtp">
Verify OTP
</button>

</div>

</div>

<script type="module" src="login.js"></script>

</body>
</html>
